server {
    listen 80;
    server_name new.gelkaravan.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name new.gelkaravan.ru;

    ssl_certificate /etc/letsencrypt/live/new.gelkaravan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.gelkaravan.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend (собранный React)
    root /opt/gelkaravan-v2/frontend/dist;
    index index.html;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Фото товаров
    location /photos/ {
        alias /opt/gelkaravan-v2/backend/uploads/photos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
